<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Admin Login | Screen Recorder</title>
    <link rel="stylesheet" href="../css/login.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
      .admin-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: linear-gradient(135deg, #f59e0b, #d97706);
        color: #fff;
        padding: 5px 14px;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 600;
        margin-bottom: 0.8rem;
      }
      .admin-badge i {
        font-size: 0.7rem;
      }
    </style>
  </head>
  <body>
    <div class="page-wrap">
      <!-- ── LEFT PANEL ──────────────────────────────────── -->
      <div class="left-bg">
        <div class="grid-lines"></div>
        <div class="particles" id="particles"></div>

        <div class="left-content">
          <div class="logo-mark">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="2" y="3" width="20" height="14" rx="3" />
              <path d="M8 21h8M12 17v4" />
              <circle cx="17" cy="8" r="2" fill="currentColor" stroke="none" />
              <path d="M15 8l-4 4-2-2" />
            </svg>
          </div>

          <h1 class="animated-gradient-text">Admin Panel</h1>
          <p class="left-subtitle">Secure access for administrators only.</p>

          <ul class="feature-list">
            <li class="feature-item">
              <span class="feature-icon"><i class="fas fa-shield-alt"></i></span
              >Secure authentication
            </li>
            <li class="feature-item">
              <span class="feature-icon"><i class="fas fa-users-cog"></i></span
              >User management
            </li>
            <li class="feature-item">
              <span class="feature-icon"><i class="fas fa-chart-bar"></i></span
              >Analytics dashboard
            </li>
            <li class="feature-item">
              <span class="feature-icon"><i class="fas fa-cog"></i></span>System
              settings
            </li>
          </ul>

          <div class="secure-badge">
            <i class="fas fa-lock"></i> Restricted access · Authorized only
          </div>
        </div>
      </div>

      <!-- ── RIGHT PANEL ─────────────────────────────────── -->
      <div class="right-panel">
        <div class="form-card">
          <div class="form-header">
            <div class="form-header-icon">
              <i class="fas fa-user-shield"></i>
            </div>
            <div class="admin-badge">
              <i class="fas fa-crown"></i> Admin Access
            </div>
            <h2 class="form-title">Admin Login</h2>
            <p class="form-subtitle">Sign in to manage your platform</p>
          </div>

          <!-- Message area -->
          <div id="loginMessage"></div>

          <form id="loginForm" autocomplete="off">
            <div class="field-group">
              <label class="field-label" for="email">Admin Email</label>
              <div class="field-wrap">
                <i class="fas fa-envelope field-icon"></i>
                <input
                  type="email"
                  id="email"
                  name="email"
                  class="form-input"
                  placeholder="admin@example.com"
                  required
                  autocomplete="email"
                />
              </div>
            </div>

            <div class="field-group">
              <label class="field-label" for="password">Password</label>
              <div class="field-wrap">
                <i class="fas fa-lock field-icon"></i>
                <input
                  type="password"
                  id="password"
                  name="password"
                  class="form-input"
                  placeholder="Enter your password"
                  required
                />
                <i class="fas fa-eye-slash toggle-password"></i>
              </div>
            </div>

            <button type="submit" class="btn-gradient">
              <i class="fas fa-sign-in-alt"></i>
              <span>Sign In to Admin</span>
            </button>
          </form>

          <p class="form-footer">
            <a href="http://localhost:5000/login">← Back to User Login</a>
          </p>
        </div>
      </div>
    </div>

    <script>
      const API_BASE = "http://localhost:5000/api";

      // Password toggle
      document
        .querySelector(".toggle-password")
        ?.addEventListener("click", function () {
          const input = document.getElementById("password");
          const type =
            input.getAttribute("type") === "password" ? "text" : "password";
          input.setAttribute("type", type);
          this.classList.toggle("fa-eye");
          this.classList.toggle("fa-eye-slash");
        });

      // Particle generator
      (function () {
        const c = document.getElementById("particles");
        if (!c) return;
        for (let i = 0; i < 28; i++) {
          const p = document.createElement("div");
          p.className = "particle";
          p.style.cssText = `width:${2 + Math.random() * 2}px;height:${2 + Math.random() * 2}px;top:${Math.random() * 100}%;left:${Math.random() * 100}%;--d:${3 + Math.random() * 5}s;--delay:${Math.random() * 4}s;`;
          c.appendChild(p);
        }
      })();

      // Show message
      function showMessage(msg, isError = true) {
        const msgDiv = document.getElementById("loginMessage");
        const icon = isError ? "fa-exclamation-circle" : "fa-check-circle";
        const cls = isError ? "error" : "success";
        msgDiv.innerHTML = `<div class="msg-box ${cls}"><i class="fas ${icon}"></i><span>${msg}</span></div>`;
        setTimeout(() => (msgDiv.innerHTML = ""), 5000);
      }

      // Login form
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;

          if (!email || !password) {
            showMessage("Please fill in all fields.");
            return;
          }

          try {
            const res = await fetch(`${API_BASE}/admin/login`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password }),
            });
            const data = await res.json();

            if (res.ok) {
              sessionStorage.setItem("adminToken", data.token);
              sessionStorage.setItem("adminUser", JSON.stringify(data.user));
              showMessage("Login successful! Redirecting…", false);
              setTimeout(() => {
                window.location.href = "/admin/dashboard";
              }, 1500);
            } else {
              showMessage(
                data.message || "Invalid credentials or not an admin.",
              );
            }
          } catch (err) {
            showMessage("Server error. Please try again.");
          }
        });
    </script>
  </body>
</html>
